; Fellside — runtime configuration, read once on startup.
; SecGen (or a config generator) can overwrite this file to randomise a build.

[shop]
name            = "Fellside"
tagline         = "Outdoor kit, tested on the Dales and posted from Otley"
currency_symbol = "£"
free_delivery_over = 60
delivery_cost   = 4.95
support_email   = "help@fellside.test"

[database]
path = "/var/www/data/fellside.sqlite"

[seed]
; Change these to randomise accounts per build
admin_username = "admin"
admin_password = "Pen-y-ghent-694"
customer_password = "moorland"

[vulnerabilities]
; one switch per vuln, on = vulnerable
a01_idor_orders   = off
a02_xss           = off
a03_sqli_search   = off
a08_upload        = off

[vuln.a01_idor_orders]
flag = "FLAG{change-me-too}"

[vuln.a02_xss]
type   = "reflected"     ; stored | reflected
filter = "none"       ; none | strip_script, for difficulty
flag = "FLAG{change-me-too}"


[vuln.a03_sqli_search]
; parameters for that vuln
flag   = "FLAG{change-me}"
filter = "none"        ; none | basic | quotes, for difficulty levels
flag = "FLAG{change-me-too}"